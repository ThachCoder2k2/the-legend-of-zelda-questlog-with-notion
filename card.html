<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest Log</title>
<!--
  Quest Log card, styled after the menu language of Zelda: Tears of the Kingdom (Purah Pad black,
  cyan italic text, gold selection cursor, stamina-wheel progress, item description pane). Everything is
  drawn with CSS and inline SVG; no game assets are used. Data comes from window.QL_DATA (see README.md).

  Controls: hover or ↑/↓ moves the cursor; Space or the status slot opens the action menu (Clear, In progress,
  Move to tomorrow, To do, Undo, Open in Notion); Enter or double-click opens the quest in Notion; B opens the
  board; Esc closes (the menu first). Drag the header to move. All UI text is English.
-->
<style>
  @property --p { syntax: '<number>'; inherits: false; initial-value: 0; }

  :root {
    --void: #010001; --void-deep: #020A12; --constellation: #0D323F;
    --cell: #00121B; --cell-border: #005165;
    --row-fill: #010308; --row-border: #0A4C5C; --row-border-done: #123038;
    --band: #06314D; --band2: #04243A; --streak: rgba(0,228,255,.35);
    --rim: #2AB4E0;
    --text-active: #79C9FB; --text-selected: #E8F6FF; --halo: #06345E; --text-body: #83C4FF;
    --ui-cyan: #6EDAFF; --cream: #FDFBF0; --cream-icon: #FFFDE3; --cream-grey: #A4A49A;
    --gold: #FBE46A; --gold-soft: #F8D878; --gold-glow: rgba(247,226,154,.45);
    --done-text: #66768A; --slot-fill: #051521; --slot-border: #445D65;
    --slot-a: #1269C3; --slot-b: #0F4696; --slot-rim: #325FA6; --marker: #053642;
    --giver: #DD5B30; --mint: #42FFBA; --stamina: #78EE74; --gloom: #B79BD0; --gloom-border: #5A3F66;
    --heart: #DC734F; --lav: #8FA8E8; --stamp: #FDF3B8; --stamp-line: #403910; --tan: rgba(185,165,106,.5);
    --num: #FFFFFF; --glow-k: 1;
    --font: "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
  }
  body.k-midday  { --band: #05384C; --band2: #042A38; }
  body.k-evening { --band: #0B2340; --band2: #081A2E; --streak: rgba(0,228,255,.22); --num: #E9F2FA; --glow-k: .6; }
  body.k-weekly  { --band: #06314D; --band2: #04243A; }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body {
    font-family: var(--font); font-style: italic; color: var(--text-active);
    -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; cursor: default;
  }
  body.preview { min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 20px; overflow: auto;
    background: radial-gradient(900px 600px at 15% 15%, #1d2a3a, transparent 60%), radial-gradient(800px 600px at 90% 90%, #23182e, transparent 60%), #0a0c12; }
  button { font: inherit; color: inherit; }

  /* ---------- card: Purah Pad void ---------- */
  .card {
    position: relative; width: 440px; overflow: hidden; border-radius: 14px; isolation: isolate;
    background:
      radial-gradient(circle 1px at 20px 20px, var(--constellation) 98%, transparent) 0 0 / 46px 46px,
      linear-gradient(115deg, transparent 49.7%, rgba(13,50,63,.45) 50%, transparent 50.3%) 0 0 / 138px 138px,
      linear-gradient(180deg, #010001 0%, #020A12 100%);
    border: 1px solid rgba(42,180,224,.6);
    box-shadow: inset 0 0 0 1px rgba(2,189,247,.10), inset 0 0 26px rgba(42,180,224,calc(.12 * var(--glow-k)));
  }
  .card::after, .stone2 { content: ""; position: absolute; width: 70px; height: 70px; pointer-events: none; z-index: 0; opacity: .45;
    background: repeating-radial-gradient(circle at 0 100%, rgba(70,74,74,.6) 0 2px, transparent 2px 6px);
    -webkit-mask: radial-gradient(circle at 0 100%, #000 28%, transparent 70%); mask: radial-gradient(circle at 0 100%, #000 28%, transparent 70%); }
  .card::after { left: 0; bottom: 0; }
  .stone2 { right: 0; top: 0; transform: rotate(180deg); }

  /* ---------- header band (also the drag handle) ---------- */
  .hd { position: relative; z-index: 2; display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center;
    padding: 16px 16px 14px; background: linear-gradient(180deg, var(--band), var(--band2)); cursor: grab; }
  .hd:active { cursor: grabbing; }
  .hd::after { content: ""; position: absolute; left: 0; right: 0; bottom: -9px; height: 10px;
    background: radial-gradient(circle 11px at 11px 0, var(--band2) 98%, transparent) 0 0 / 22px 10px repeat-x,
                radial-gradient(circle 7px at 17px 0, var(--band2) 98%, transparent) 0 0 / 34px 8px repeat-x; }
  .hd::before { content: ""; position: absolute; left: 0; right: 0; top: calc(100% + 1px); height: 26px; pointer-events: none; opacity: .8;
    background: repeating-linear-gradient(90deg, transparent 0 37px, var(--streak) 37px 38px),
                repeating-linear-gradient(90deg, transparent 0 59px, rgba(0,228,255,.18) 59px 60px);
    -webkit-mask: linear-gradient(#000, transparent); mask: linear-gradient(#000, transparent); }
  body.k-weekly .hd { box-shadow: 0 10px 0 -9px rgba(248,216,120,.5); }

  .slot { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 3px; color: var(--cream-icon);
    background: linear-gradient(160deg, var(--slot-a), var(--slot-b)); border: 1px solid var(--slot-border);
    box-shadow: inset 0 0 0 3px var(--slot-fill), inset 0 0 0 4px var(--slot-border), inset 0 0 0 5px var(--slot-rim); }
  .slot svg { width: 26px; height: 26px; filter: drop-shadow(0 0 6px rgba(175,255,255,.6)); }
  .htext { min-width: 0; }
  .eyebrow { font-size: 11.5px; line-height: 1.3; font-weight: 500; color: #E8E4CC; }
  .title { font-size: 22px; line-height: 1.18; font-weight: 700; color: #BFE6FF; padding-top: 1px;
    text-shadow: 0 0 calc(12px * var(--glow-k)) rgba(47,168,255,.6), 0 0 3px var(--halo); }
  .subtitle { font-size: 13px; line-height: 1.35; color: var(--cream-grey); margin-top: 2px; }
  .stamp { align-self: end; font: 700 13px/1 Palatino, "Palatino Linotype", Georgia, serif; font-style: normal;
    font-variant-caps: all-small-caps; letter-spacing: .06em; color: var(--stamp); white-space: nowrap;
    text-shadow: -1px 0 var(--stamp-line), 1px 0 var(--stamp-line), 0 -1px var(--stamp-line), 0 1px var(--stamp-line), 0 0 10px rgba(254,253,208,.5);
    transform: rotate(-6deg); }
  .emo { font-style: normal; text-shadow: none; filter: none; }
  .rule { position: relative; z-index: 1; height: 1px; margin: 9px 0 0;
    background: linear-gradient(90deg, rgba(27,140,166,0), #1B8CA6 30%, #1B8CA6); }

  /* ---------- progress: stamina wheel ---------- */
  .prog { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; margin: 16px 16px 2px; }
  .prog .bar { flex: 1; height: 2px; background: linear-gradient(90deg, transparent, #0E6074); }
  .prog .bar.r { background: linear-gradient(270deg, transparent, #0E6074); }
  .wheel { position: relative; width: 54px; height: 54px; flex: none; }
  .ring { position: absolute; inset: 0; border-radius: 50%; --p: 0;
    background: conic-gradient(var(--stamina) calc(var(--p) * 1%), var(--constellation) 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
    filter: drop-shadow(0 0 6px rgba(120,238,116,.45)); transition: --p .6s cubic-bezier(.2,.8,.2,1) .3s; }
  .ring.inner { inset: 8px; background: conic-gradient(var(--cream-icon) calc(var(--p) * 1%), rgba(13,50,63,.8) 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); filter: none; }
  .wheel .cnt { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: var(--num);
    font-variant-numeric: tabular-nums; }

  /* ---------- stat chips ---------- */
  .stats { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); gap: 8px; margin: 14px 16px 0; }
  .chip { background: var(--cell); border: 1px solid var(--cell-border); border-radius: 4px; padding: 7px 4px 6px; text-align: center; min-width: 0; }
  .chip .v { display: flex; align-items: center; justify-content: center; gap: 5px; font-weight: 700; font-size: 19px; line-height: 1.15; color: var(--num); font-variant-numeric: tabular-nums; }
  .chip .v svg { width: 13px; height: 13px; flex: none; }
  .chip .l { font-weight: 500; font-size: 11px; line-height: 1.25; color: var(--ui-cyan); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip.gloom { border-color: var(--gloom-border); } .chip.gloom .v { color: var(--gloom); } .chip.zero .v { color: var(--mint); }

  /* ---------- lists ---------- */
  .lists { position: relative; z-index: 1; max-height: 560px; overflow-y: auto; overflow-x: hidden; padding: 2px 0 4px; }
  .lists::-webkit-scrollbar { width: 4px; } .lists::-webkit-scrollbar-thumb { background: #0A4C5C; border-radius: 4px; }
  .sh { display: flex; align-items: center; gap: 8px; margin: 16px 16px 8px 28px; font-weight: 500; font-size: 14px; line-height: 1.3;
    color: var(--cream); text-shadow: 0 0 8px rgba(253,251,240,.35); }
  .sh svg { width: 16px; height: 16px; color: var(--cream-icon); flex: none; }
  .sh .ln { flex: 1; height: 1px; background: linear-gradient(90deg, #2D8FB0, rgba(45,143,176,.08)); }
  .sh .n { font-size: 12px; color: var(--ui-cyan); text-shadow: 0 0 6px rgba(110,218,255,.4); font-variant-numeric: tabular-nums; }
  .divider { display: flex; align-items: center; gap: 8px; margin: 14px 40px 0; height: 12px; }
  .divider i { flex: 1; height: 1px; background: var(--tan); }
  .divider svg { width: 16px; height: 9px; }

  .q { position: relative; display: grid; grid-template-columns: 28px 1fr 24px; gap: 10px; align-items: center;
    min-height: 44px; margin: 0 16px 8px 28px; padding: 6px 8px; background: var(--row-fill);
    border: 1px solid var(--row-border); border-radius: 2px; transition: border-color .16s, background-color .16s; }
  .q.pick { cursor: pointer; }
  .q.sel { background: linear-gradient(90deg, #04203A, var(--row-fill) 70%); border-color: transparent; }
  .q .t { font-weight: 700; font-size: 15px; line-height: 1.3; color: var(--text-active); padding-top: 1px;
    text-shadow: 0 0 8px var(--halo), 0 0 16px rgba(6,52,94,.6); transition: color .16s;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .q.sel .t { color: var(--text-selected); text-shadow: 0 0 10px var(--slot-a); }
  .q .tg { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 11.5px; line-height: 1.35; color: var(--cream-grey); min-width: 0; }
  .q .tg .day { color: var(--ui-cyan); font-weight: 600; white-space: nowrap; }
  .q .tg .warn { flex: none; width: 12px; height: 12px; border-radius: 50%; display: grid; place-items: center;
    background: var(--giver); box-shadow: 0 0 0 1px rgba(242,175,132,.5); color: #fff; font: 800 9px/1 "Helvetica Neue", sans-serif; }
  .q .tg .ln { flex: 1; min-width: 12px; height: 1px; background: rgba(253,251,240,.2); }
  .q .tg .live { color: #6EDAFF; font-weight: 600; }
  .q .tg span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .tslot { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 3px;
    background: var(--slot-fill); border: 1px solid var(--slot-border); box-shadow: inset 0 0 0 2px var(--slot-fill), inset 0 0 0 3px var(--slot-border); }
  .tslot svg { width: 16px; height: 16px; filter: drop-shadow(0 0 4px currentColor); }
  .tslot.main { background: linear-gradient(160deg, var(--slot-a), var(--slot-b)); color: var(--cream-icon); box-shadow: inset 0 0 0 2px var(--slot-fill), inset 0 0 0 3px var(--slot-rim); }
  .tslot.side { color: #AFD8F5; } .tslot.fun { color: var(--lav); }

  /* status slot: click (or Space) opens the action menu; its glyph shows the quest's state */
  .mk { width: 24px; height: 24px; padding: 0; display: grid; place-items: center; border-radius: 4px; cursor: pointer;
    background: var(--marker); border: 1px solid #0E5A6C; box-shadow: inset 0 0 0 2px var(--slot-fill);
    transition: border-color .15s, box-shadow .15s, background-color .15s; }
  .mk svg { width: 15px; height: 15px; transition: opacity .18s, transform .28s cubic-bezier(.3,1.6,.5,1); }
  .mk:hover, .q.sel .mk { border-color: var(--gold-soft); box-shadow: inset 0 0 0 2px var(--slot-fill), 0 0 8px rgba(248,216,120,.35); }
  .mk:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .mk.static { cursor: default; border-style: dashed; opacity: .5; }
  .mk.static svg { display: none; }
  .mk.s-todo svg { color: var(--ui-cyan); opacity: 0; transform: scale(.6); }
  .q.sel .mk.s-todo svg, .mk.s-todo:hover svg { opacity: .85; transform: none; }
  .mk.s-done { background: rgba(66,255,186,.08); border-color: rgba(66,255,186,.45); }
  .mk.s-done svg { color: var(--mint); filter: drop-shadow(0 0 4px rgba(66,255,186,.6)); }
  .mk.s-live { background: rgba(255,180,92,.07); border-color: rgba(255,180,92,.45); }
  .mk.s-live svg { color: #FFB45C; filter: drop-shadow(0 0 4px rgba(255,160,80,.6)); }
  .mk.s-moved { background: rgba(183,155,208,.08); border-color: var(--gloom-border); }
  .mk.s-moved svg { color: var(--gloom); }
  .q.moved:not(.sel) { background: var(--void); border-color: #2A2236; }
  .q.moved .t { font-weight: 500; color: #8F86A3; text-shadow: none; }
  .q.done:not(.sel) { background: var(--void); border-color: var(--row-border-done); }
  .q.done .t { font-weight: 500; color: var(--done-text); text-shadow: none; }
  .q.done.sel .t { color: #9FB2C4; }
  .q.done .tslot { opacity: .7; background: var(--slot-fill); color: #6B7F8C; }
  body.go .q.flash { animation: flash .6s ease-out; }
  @keyframes flash { 0% { box-shadow: inset 0 0 0 40px rgba(66,255,186,.16); } 100% { box-shadow: inset 0 0 0 40px rgba(66,255,186,0); } }

  /* the single gold cursor: one frame that slides between rows */
  .cur { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 2; pointer-events: none; border-radius: 6px; opacity: 0;
    border: 1px solid var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 14px rgba(247,226,154,calc(.38 * var(--glow-k))), inset 0 0 10px rgba(247,226,154,.08);
    transition: transform .16s cubic-bezier(.2,.8,.2,1), height .16s cubic-bezier(.2,.8,.2,1), opacity .2s; }
  .cur::before { content: ""; position: absolute; left: -15px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-left: 8px solid #fff; border-right: 0;
    filter: drop-shadow(0 0 4px rgba(255,255,255,.7)); }
  .cur.on { opacity: 1; }

  body.k-weekly .q { min-height: 38px; padding: 4px 8px; margin-bottom: 6px; }
  body.k-weekly .q .t { -webkit-line-clamp: 1; font-size: 14px; }
  body.k-weekly .q .tg { margin-top: 1px; }
  body.k-weekly .mk { width: 22px; height: 22px; }
  .more { margin: -2px 16px 8px 28px; font-size: 11.5px; color: var(--cream-grey); display: flex; align-items: center; gap: 8px; }
  .more::after { content: ""; flex: 1; height: 1px; background: rgba(110,218,255,.15); }
  .empty { margin: 0 16px 8px 28px; padding: 10px 12px; border: 1px dashed #0A4C5C; border-radius: 2px; font-size: 13px; color: var(--cream-grey); }

  /* XP (weekly) */
  .xp { margin: 0 16px 6px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
  .xp .it { font-size: 12px; color: var(--ui-cyan); }
  .xp .it .nm { display: flex; justify-content: space-between; gap: 6px; }
  .xp .it .nm b { color: var(--num); font-weight: 700; font-variant-numeric: tabular-nums; }
  .xp .it .tr { height: 4px; margin-top: 3px; border-radius: 2px; background: var(--constellation); overflow: hidden; }
  .xp .it .tr i { display: block; height: 100%; width: 0; background: var(--stamina); box-shadow: 0 0 6px rgba(120,238,116,.5); transition: width .6s cubic-bezier(.2,.8,.2,1) .6s; }

  /* ---------- description pane v2 (follows the cursor): status/energy/questline sit on the border as tabs ---------- */
  .desc { position: relative; z-index: 1; margin: 16px 16px 14px; padding: 12px 12px 12px 16px; border-radius: 6px; --ac: var(--gold);
    background: linear-gradient(180deg, rgba(4,32,58,.55), rgba(1,3,8,.9) 52%), rgba(10,15,12,.82);
    border: 1px solid rgba(110,218,255,.20); box-shadow: inset 0 1px 0 rgba(110,218,255,.08), 0 0 18px rgba(0,0,0,.35); }
  .desc[data-type="side"] { --ac: #AFD8F5; } .desc[data-type="fun"] { --ac: var(--lav); }
  .desc::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 6px 0 0 6px; background: var(--ac);
    -webkit-mask: linear-gradient(#000 55%, transparent); mask: linear-gradient(#000 55%, transparent); }
  body.k-weekly .desc { border-color: rgba(248,216,120,.30); }

  .desc .dt { font-size: 14.5px; line-height: 1.3; font-weight: 700; color: var(--text-selected); text-shadow: 0 0 10px var(--slot-a);
    padding: 2px 0 1px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }   /* padding keeps stacked Vietnamese diacritics inside the clip */

  /* tab strip straddling the top border: [status][energy] ........ [questline] (absolute: costs no height) */
  .desc .dm { position: absolute; top: -10px; left: 14px; right: 14px; display: flex; align-items: center; gap: 6px; pointer-events: none; }
  .desc .dm[hidden], .desc .lb[hidden] { display: none; }                      /* the author display:flex rules would otherwise beat the [hidden] attribute */
  .desc .dm > span { display: inline-flex; align-items: center; gap: 6px; height: 19px; padding: 0 9px 0 7px; font-size: 11.5px; line-height: 1; font-weight: 600;
    color: var(--ui-cyan); background: var(--cell); border: 1px solid var(--cell-border); border-radius: 3px; white-space: nowrap; }
  .desc .dm .ql { margin-left: auto; min-width: 0; flex: 0 1 auto; }
  .desc .dm .ql svg { width: 10px; height: 10px; flex: none; }
  .desc .dm .ql b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; padding: 2px 0; }
  .desc .st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; }
  .desc .st.live { color: #BFEFFF; border-color: rgba(110,218,255,.5); } .desc .st.live::before { background: currentColor; box-shadow: 0 0 6px currentColor; }
  .desc .st.done { color: var(--mint); border-color: rgba(66,255,186,.4); } .desc .st.done::before { background: currentColor; box-shadow: none; }
  .desc .st.delay { color: var(--gloom); border-color: var(--gloom-border); }
  .desc .dm .pip { width: 8px; height: 8px; border-radius: 50%; background: none; box-shadow: none; border: 1.5px solid rgba(120,238,116,.5); margin-right: -2px; }
  .desc .dm .pip.on { background: var(--stamina); border-color: var(--stamina); box-shadow: 0 0 6px rgba(120,238,116,calc(.55 * var(--glow-k))); }

  /* the label row doubles as the title rule; gold stays reserved for the cursor and this label */
  .desc .lb { display: flex; align-items: center; gap: 8px; margin-top: 7px; font-weight: 600; font-size: 12.5px; color: var(--gold-soft); text-shadow: 0 0 8px rgba(248,216,120,.4); }
  .desc .lb i { width: 11px; height: 11px; flex: none; border-radius: 50%; border: 1.5px solid var(--gold-soft);
    background: radial-gradient(circle, var(--gold-soft) 0 2px, transparent 2.5px); box-shadow: 0 0 0 2px var(--void), 0 0 0 3px rgba(248,216,120,.6); }
  .desc .lb::after { content: ""; flex: 1; min-width: 12px; height: 1px; background: linear-gradient(90deg, rgba(248,216,120,.5), rgba(45,143,176,.28) 40%, rgba(45,143,176,.06)); }
  .desc .tx { font-size: 13.5px; line-height: 1.45; color: var(--text-body); margin-top: 3px; text-shadow: 0 0 8px rgba(6,52,94,.8);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .desc code { font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; font-style: normal; color: #FF8A5C; background: rgba(255,106,56,.1); padding: 0 4px; border-radius: 3px; }

  /* sync note: a tab on the bottom border instead of a reserved line */
  .desc .sync { position: absolute; right: 14px; bottom: -11px; height: 18px; max-width: 72%; padding: 0 9px; display: flex; align-items: center;
    font-size: 11.5px; line-height: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--cream-grey); background: var(--cell); border: 1px solid var(--cell-border); border-radius: 3px; }
  .desc .sync:empty { display: none; }
  .desc .sync.ok { color: var(--mint); border-color: rgba(66,255,186,.4); } .desc .sync.wait { color: var(--gold-soft); border-color: rgba(248,216,120,.4); }
  .desc .body { transition: opacity .12s; } .desc.swap .body { opacity: .35; }
  .note { position: relative; z-index: 1; margin: 10px 16px 0; font-size: 12px; line-height: 1.4; color: var(--cream-grey); }

  /* ---------- footer: button prompts ---------- */
  .ft { position: relative; z-index: 1; display: flex; justify-content: flex-end; gap: 16px; margin-top: 14px; padding: 10px 14px 12px;
    background: linear-gradient(0deg, var(--band), rgba(4,36,58,.6) 60%, transparent); }
  .ft::before { content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 16px; pointer-events: none;
    background: repeating-linear-gradient(90deg, transparent 0 41px, var(--streak) 41px 42px);

  .kp { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 2px; font: italic 600 13px var(--font);
    color: #6EDBFF; opacity: .85; background: none; border: 0; cursor: pointer; transition: text-shadow .15s, opacity .15s; white-space: nowrap; }
  .kp.pri { color: #BFEFFF; font-weight: 700; opacity: 1; }

  [hidden] { display: none !important; }

  /* ---------- two-pane stage: quest list card on the left, detail panel on the right (TOTK Adventure Log) ---------- */
  .stage { position: relative; display: flex; align-items: flex-start; gap: 10px; width: max-content; }
  .sidepane { position: relative; width: 440px; overflow: hidden; border-radius: 14px; isolation: isolate;
    border: 1px solid rgba(42,180,224,.6);
    box-shadow: inset 0 0 0 1px rgba(2,189,247,.10), inset 0 0 26px rgba(42,180,224,calc(.12 * var(--glow-k))); }
  .sidepane.in { animation: sidein .26s cubic-bezier(.2,.8,.2,1); }
  @keyframes sidein { from { opacity: 0; transform: translateX(-22px); } }
  /* In the window the stage hugs the right edge, so the card stays still while the window grows to the left
     and the detail panel opens on the card's left. If the host had to grow to the right instead, it says so.
     Pinned with right: 0 (not margin-left: auto) so that while the window is still narrower than the stage,
     the overflow goes off the left edge and the card itself stays in view. */
  body:not(.preview):not(.full) .stage { position: absolute; top: 0; right: 0; }
  body.grow-right:not(.preview):not(.full) .stage { right: auto; left: 0; }
  .stage.flip { flex-direction: row-reverse; }
  .stage.flip .sidepane.in { animation-name: sidein-l; }
  @keyframes sidein-l { from { opacity: 0; transform: translateX(22px); } }
  body.leaving .sidepane { animation: out .14s ease-in forwards !important; }

  /* ---------- quest detail (TOTK Adventure Log entry) ---------- */
  .detail { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 0 18px 14px 20px;
    background:
      radial-gradient(circle 1px at 20px 20px, var(--constellation) 98%, transparent) 0 0 / 46px 46px,
      linear-gradient(180deg, #010001, #020A12); }
  .detail::-webkit-scrollbar { width: 4px; } .detail::-webkit-scrollbar-thumb { background: #0A4C5C; border-radius: 4px; }
  .detail.in { animation: detin .2s cubic-bezier(.2,.8,.2,1); }
  @keyframes detin { from { opacity: 0; transform: translateY(6px); } }
  .detail .emblem { position: absolute; right: -40px; top: 40px; width: 220px; height: 220px; opacity: .07; pointer-events: none; color: var(--ui-cyan); }
  .dtop { display: flex; align-items: center; gap: 8px; height: 54px; position: sticky; top: 0; z-index: 2;
    margin: 0 -18px 0 -20px; padding: 0 18px 0 20px; background: linear-gradient(180deg, var(--band), var(--band2)); }
  .dtype { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; font-size: 12.5px; color: var(--cream); text-shadow: 0 0 8px rgba(253,251,240,.3); }
  .dtype .tslot { width: 24px; height: 24px; } .dtype .tslot svg { width: 14px; height: 14px; }
  .dtop .sp { flex: 1; }
  .dstat { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; cursor: pointer;
    background: var(--cell); border: 1px solid var(--cell-border); font: italic 600 12px var(--font); color: var(--ui-cyan); }
  .dstat svg { width: 13px; height: 13px; }
  .dstat:hover { border-color: var(--gold-soft); color: var(--text-selected); }
  .dstat.done { color: var(--mint); border-color: rgba(66,255,186,.45); } .dstat.live { color: #FFB45C; border-color: rgba(255,180,92,.45); }
  .dstat.delay { color: var(--gloom); border-color: var(--gloom-border); }
  .dtitle { margin-top: 10px; font-size: 21px; line-height: 1.22; font-weight: 700; color: #BFE6FF;
    text-shadow: 0 0 calc(12px * var(--glow-k)) rgba(47,168,255,.55), 0 0 3px var(--halo); }
  .dorn { display: flex; align-items: center; gap: 8px; margin: 10px 0 8px; }
  .dorn i { flex: 1; height: 1px; background: linear-gradient(90deg, #1B8CA6, rgba(27,140,166,.1)); }
  .dorn i:last-child { background: linear-gradient(270deg, #1B8CA6, rgba(27,140,166,.1)); }
  .dorn svg { width: 16px; height: 9px; }
  .dmeta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ui-cyan); }
  .dmeta span { display: inline-flex; align-items: center; gap: 5px; }
  .dmeta svg { width: 11px; height: 11px; flex: none; } .dmeta b { font-weight: 600; }
  .dmeta .pip { width: 7px; height: 7px; border-radius: 50%; background: #0E3A48; box-shadow: inset 0 0 0 1px #1B8CA6; }
  .dmeta .pip.on { background: var(--gold-soft); box-shadow: 0 0 5px rgba(248,216,120,.6); }
  .dsec { margin-top: 14px; }
  .dsh { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 13px; color: var(--cream); text-shadow: 0 0 8px rgba(253,251,240,.3); }
  .dsh svg { width: 14px; height: 14px; color: var(--cream-icon); }
  .dsh .ln { flex: 1; height: 1px; background: linear-gradient(90deg, #2D8FB0, rgba(45,143,176,.08)); }
  .dtx { margin-top: 5px; font-size: 13.5px; line-height: 1.5; color: var(--text-body); text-shadow: 0 0 8px rgba(6,52,94,.8); }
  .dtx code { font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; font-style: normal; color: #FF8A5C; background: rgba(255,106,56,.1); padding: 0 4px; border-radius: 3px; }
  .dtx.muted { color: var(--cream-grey); }
  .steps { margin: 6px 0 0; padding: 0; list-style: none; }
  .steps li { position: relative; display: flex; align-items: flex-start; gap: 9px; padding: 4px 0 4px 2px; font-size: 13px; line-height: 1.35; color: var(--text-active); }
  .steps li::before { content: ""; position: absolute; left: 8px; top: 18px; bottom: -6px; width: 1px; background: rgba(110,218,255,.18); }
  .steps li:last-child::before { display: none; }
  .steps .dot { flex: none; width: 13px; height: 13px; margin-top: 2px; border-radius: 50%; border: 1.5px solid #1B8CA6; background: var(--void); display: grid; place-items: center; z-index: 1; }
  .steps .dot svg { width: 9px; height: 9px; }
  .steps li.done { color: var(--done-text); } .steps li.done .dot { border-color: rgba(66,255,186,.6); color: var(--mint); }
  .steps li.this { color: var(--text-selected); font-weight: 600; } .steps li.this .dot { border-color: var(--gold); box-shadow: 0 0 6px rgba(251,228,106,.6); background: radial-gradient(circle, var(--gold) 0 3px, var(--void) 3.5px); }
  .steps .sd { margin-left: auto; padding-left: 8px; font-size: 11px; color: var(--cream-grey); white-space: nowrap; }
  .dsync { margin-top: 12px; font-size: 11.5px; color: var(--cream-grey); min-height: 15px; }
  .dsync.ok { color: var(--mint); } .dsync.wait { color: var(--gold-soft); }

  /* ---------- action menu (TOTK item command list) ---------- */
  .menu { position: absolute; z-index: 6; min-width: 200px; padding: 6px; border-radius: 8px;
    background: linear-gradient(180deg, rgba(4,20,34,.98), rgba(1,6,12,.98)); border: 1px solid rgba(42,180,224,.7);
    box-shadow: 0 10px 28px rgba(0,0,0,.6), inset 0 0 0 1px rgba(2,189,247,.12), inset 0 0 18px rgba(42,180,224,.12); }
  .menu.in { animation: menuin .14s cubic-bezier(.2,.8,.2,1); transform-origin: top right; }
  @keyframes menuin { from { opacity: 0; transform: translateY(-4px) scale(.97); } }
  .mi { position: relative; display: flex; align-items: center; gap: 9px; width: 100%; height: 32px; padding: 0 10px 0 8px;
    border: 1px solid transparent; border-radius: 5px; background: none; cursor: pointer; text-align: left;
    font: italic 600 13.5px var(--font); color: var(--text-active); text-shadow: 0 0 8px var(--halo); }
  .mi .g { width: 18px; height: 18px; display: grid; place-items: center; flex: none; }
  .mi .g svg { width: 15px; height: 15px; }
  .mi.c-done .g { color: var(--mint); } .mi.c-live .g { color: #FFB45C; } .mi.c-move .g { color: var(--gloom); }
  .mi.c-todo .g { color: var(--ui-cyan); } .mi.c-undo .g { color: var(--cream-grey); } .mi.c-open .g { color: var(--ui-cyan); }
  .mi .lbl { flex: 1; white-space: nowrap; }
  .mi .now { font-size: 10.5px; font-weight: 500; color: var(--cream-grey); }
  .mi.current { opacity: .45; cursor: default; }
  .mi.on { border-color: var(--gold); color: var(--text-selected); background: linear-gradient(90deg, rgba(4,32,58,.9), transparent);
    box-shadow: 0 0 0 1px rgba(251,228,106,.6), 0 0 12px rgba(247,226,154,.3); }
  .mi.on::before { content: ""; position: absolute; left: -13px; top: 50%; margin-top: -5px; border: 5px solid transparent;
    border-left: 7px solid #fff; border-right: 0; filter: drop-shadow(0 0 3px rgba(255,255,255,.7)); }
  .msep { display: block; height: 1px; margin: 4px 6px; background: rgba(110,218,255,.18); }
  body.menu-open .cur { opacity: .55; }

  .toast { position: absolute; left: 50%; bottom: 58px; z-index: 5; transform: translate(-50%, 6px); opacity: 0; pointer-events: none;
    padding: 6px 12px; border-radius: 14px; background: rgba(1,8,14,.94); border: 1px solid var(--gold-soft); color: var(--cream);
    font-size: 12px; white-space: nowrap; transition: opacity .18s, transform .18s; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- motion (held until the window is on screen) ---------- */
  body:not(.go) .card, body:not(.go) .anim, body:not(.go) .q { opacity: 0; }
  body.go .card { animation: cardin .28s cubic-bezier(.2,.8,.2,1) both; }
  body.go .rule { animation: wipe .22s cubic-bezier(.2,.8,.2,1) .06s both; }
  body.go .htext, body.go .slot { animation: fade .32s ease-out .16s both; }
  body.go .stamp:not([hidden]) { animation: fade .3s ease-out .45s both; }
  body.go .prog { animation: fade .3s ease-out .3s both; }
  body.go .chip { animation: fade .18s ease-out both; animation-delay: calc(380ms + var(--i) * 40ms); }
  body.go .q, body.go .sh, body.go .more, body.go .empty, body.go .xp, body.go .divider { animation: rowin .2s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(520ms + var(--i, 0) * 45ms); }
  body.go .desc, body.go .note { animation: fade .25s ease-out both; animation-delay: calc(640ms + var(--last, 0) * 45ms); }
  body.go .ft { animation: fade .25s ease-out 1s both; }
  @keyframes cardin { from { opacity: 0; transform: translateY(8px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rowin { from { opacity: 0; transform: translateX(-6px); } }
  @keyframes wipe { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0); } }
  body.leaving .card { animation: out .14s ease-in forwards !important; }
  @keyframes out { to { opacity: 0; } }


  /* ===== design details (judged set P1-P11) ===== */
  /* P1 - gold cursor v2: breathing glow (opacity only), arrival pointer, quiet on done rows */
  :root { --lo: .55; }                                   /* floor of the breathing glow */
  body.k-evening { --lo: .8; }                           /* evening: half the pulse amplitude (glow alpha is also x --glow-k) */
  .lists { padding: 8px 0 10px; margin: -6px 0; }        /* room for the glow so the scroller does not slice it (net layout is the same as before: +2 top, +4 bottom) */
  .cur { box-shadow: 0 0 0 1px var(--gold), 0 0 8px rgba(247,226,154,calc(.28 * var(--glow-k))), inset 0 0 14px rgba(247,226,154,.07);
  transition: transform .16s cubic-bezier(.2,.8,.2,1), height .16s cubic-bezier(.2,.8,.2,1), opacity .2s, border-color .2s, box-shadow .2s; }
  .cur::after { content: ""; position: absolute; inset: -1px; border-radius: 7px; opacity: var(--lo);
  box-shadow: 0 0 16px 1px rgba(247,226,154,calc(.5 * var(--glow-k))); }                /* painted once; only its opacity animates */
  body.go .cur.on { animation: none; }
  body.go .cur.on::after { animation: breathe 1.6s ease-in-out 1.2s infinite; }          /* the ONE infinite animation on the card */
  @keyframes breathe { 50% { opacity: 1; } }
  body.go .cur.arrive::before { animation: ptr .2s cubic-bezier(.2,.8,.2,1) both; }      /* the white pointer taps in on every move */
  @keyframes ptr { from { opacity: 0; transform: translateX(-6px); } }
  /* the cursor resting on a done row is quieter: dimmer frame, no breathing (:has needs Safari 15.4+) */
  .lists:has(.q.done.sel) .cur { border-color: rgba(251,228,106,.7); box-shadow: 0 0 0 1px rgba(251,228,106,.7), 0 0 8px rgba(247,226,154,calc(.16 * var(--glow-k))); }
  .lists:has(.q.done.sel) .cur::after { opacity: .3; animation: none; }
  /* P2 - the selected slot lights up blue; the selected row previews its check */
  .q.sel .tslot { background: linear-gradient(160deg, #2B8BF0, #1456B8); color: #fff;
  box-shadow: inset 0 0 0 2px var(--slot-fill), inset 0 0 0 3px #5C93E0, 0 0 10px rgba(47,168,255,calc(.5 * var(--glow-k))); }
  .q.sel .tslot svg { filter: drop-shadow(0 0 5px rgba(190,255,255,.85)); }
  .q.sel .tg { color: #C4D2D6; }
  .q.sel .mk.s-todo svg { opacity: .3; transform: none; color: var(--gold-soft); }   /* ghost check: what Space / click will do */
  .q.sel .mk.s-todo:hover svg { opacity: .75; }

  /* P3 - row plates: etched corner caps, powered-down done rows, ring burst when a quest is ticked */
  .q { --cap: #1B8CA6;
  background:
    linear-gradient(var(--cap), var(--cap)) 0 0 / 6px 1px no-repeat,            /* top-left cap */
    linear-gradient(var(--cap), var(--cap)) 0 0 / 1px 6px no-repeat,
    linear-gradient(var(--cap), var(--cap)) 100% 100% / 6px 1px no-repeat,      /* bottom-right cap */
    linear-gradient(var(--cap), var(--cap)) 100% 100% / 1px 6px no-repeat,
    var(--row-fill);
  box-shadow: inset 0 1px 0 rgba(110,218,255,.06), inset 0 -14px 14px -14px rgba(0,0,0,.9);   /* engraved top edge + sunken base */
  transition: border-color .16s, box-shadow .16s; }
  .q.done:not(.sel) { background: repeating-linear-gradient(0deg, rgba(110,218,255,.03) 0 1px, transparent 1px 3px), var(--void); }   /* scanlines: powered down */
  .mk { position: relative; }
  .q.flash .mk::after { content: ""; position: absolute; inset: -1px; border-radius: 5px; border: 2px solid var(--mint); opacity: 0; pointer-events: none;
  animation: burst .5s cubic-bezier(.2,.8,.2,1); }                                    /* one-shot ring burst on the check slot */
  @keyframes burst { 0% { opacity: .9; transform: scale(.8); } 100% { opacity: 0; transform: scale(1.9); } }
  /* P5 - footer prompts: letter-in-circle key glyphs + press flash */
  .kp[hidden] { display: none; }
  .kp i { width: 20px; min-width: 20px; padding: 0; border-radius: 50%;
  box-shadow: 0 0 0 2px rgba(110,219,255,.16), 0 0 8px rgba(110,219,255,calc(.35 * var(--glow-k)));
  transition: transform .08s, background .08s, box-shadow .08s; }
  .kp i.pill { width: auto; min-width: 28px; padding: 0 6px; border-radius: 10px; font-size: 11px; }          /* esc */
  .kp i svg { width: 12px; height: 12px; }
  .kp.pri i { box-shadow: 0 0 0 1.5px rgba(251,228,106,.75), 0 0 10px rgba(247,226,154,calc(.35 * var(--glow-k))); }   /* Enter acts on the gold item */
  .kp:hover i { background: #A6EBFF; }
  .kp:active i, .kp.hit i { transform: scale(.9); background: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.35), 0 0 12px rgba(255,255,255,.7); }
  .kp[disabled] i { box-shadow: none; }
  /* P6 - scroll cue: the list edge that has more rows fades out (class sc = scrollable, up / dn = rows hidden above / below) */
  @property --mt { syntax: '<length>'; inherits: false; initial-value: 0px; }
  @property --mb { syntax: '<length>'; inherits: false; initial-value: 0px; }
  .lists { transition: --mt .2s, --mb .2s; }
  .lists.sc { -webkit-mask: linear-gradient(transparent 6px, #000 calc(6px + var(--mt)), #000 calc(100% - 6px - var(--mb)), transparent calc(100% - 6px));
  mask: linear-gradient(transparent 6px, #000 calc(6px + var(--mt)), #000 calc(100% - 6px - var(--mb)), transparent calc(100% - 6px)); }
  .lists.up { --mt: 18px; } .lists.dn { --mb: 22px; }
  /* P7 - stamina wheel: one arc per quest, dark core, tick bezel, glow + one flare when full; the stamp slams in */
  .prog[hidden] { display: none; }   /* morning at 0/N: the wheel row stays hidden until the first check (display:flex used to beat [hidden]) */
  .ring { -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px)),
    repeating-conic-gradient(from calc(var(--gap, 0deg) / 2), #000 0deg calc(360deg / var(--seg, 1) - var(--gap, 0deg)), transparent calc(360deg / var(--seg, 1) - var(--gap, 0deg)) calc(360deg / var(--seg, 1)));
  -webkit-mask-composite: source-in;
  mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px)),
    repeating-conic-gradient(from calc(var(--gap, 0deg) / 2), #000 0deg calc(360deg / var(--seg, 1) - var(--gap, 0deg)), transparent calc(360deg / var(--seg, 1) - var(--gap, 0deg)) calc(360deg / var(--seg, 1)));
  mask-composite: intersect; filter: none; }
  .ring.inner { -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)),
    repeating-conic-gradient(from calc(var(--gap, 0deg) / 2), #000 0deg calc(360deg / var(--seg, 1) - var(--gap, 0deg)), transparent calc(360deg / var(--seg, 1) - var(--gap, 0deg)) calc(360deg / var(--seg, 1)));
  -webkit-mask-composite: source-in;
  mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)),
    repeating-conic-gradient(from calc(var(--gap, 0deg) / 2), #000 0deg calc(360deg / var(--seg, 1) - var(--gap, 0deg)), transparent calc(360deg / var(--seg, 1) - var(--gap, 0deg)) calc(360deg / var(--seg, 1)));
  mask-composite: intersect; }
  .wheel { filter: drop-shadow(0 0 5px rgba(120,238,116,calc(.22 * var(--glow-k)))); }   /* the old drop-shadow on .ring was clipped by its own mask; the glow lives on the wrapper now */
  .wheel::before { content: ""; position: absolute; inset: 6px; border-radius: 50%;
  background: radial-gradient(circle, #04222F 0, #010A10 72%); box-shadow: inset 0 0 9px rgba(0,0,0,.9), 0 0 0 1px rgba(42,180,224,.22); }
  .wheel::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; pointer-events: none;
  background: repeating-conic-gradient(from -.8deg, rgba(110,218,255,.5) 0 1.6deg, transparent 1.6deg 15deg),
              repeating-conic-gradient(from -1.3deg, rgba(190,240,255,.9) 0 2.6deg, transparent 2.6deg 90deg);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px)); }
  .wheel.full { filter: drop-shadow(0 0 6px rgba(120,238,116,calc(.55 * var(--glow-k)))) drop-shadow(0 0 14px rgba(120,238,116,calc(.25 * var(--glow-k)))); }
  .wheel.full .cnt { text-shadow: 0 0 9px rgba(120,238,116,calc(.8 * var(--glow-k))); }
  .wheel .flare { position: absolute; inset: -1px; border-radius: 50%; border: 2px solid rgba(120,238,116,.8); opacity: 0; pointer-events: none; }
  body.go .wheel.full .flare { animation: flare 1.3s cubic-bezier(.2,.7,.2,1) 1.15s 1 forwards; }          /* one-shot, not a loop */
  body.go .wheel.full.live .flare { animation-delay: 0s; }                                                 /* ticked just now: no wait */
  @keyframes flare { from { transform: scale(1); opacity: .9; } to { transform: scale(1.9); opacity: 0; } }
  /* the Hoàn thành stamp lands, then one ink ripple */
  .stamp { position: relative; }
  .stamp::after { content: ""; position: absolute; inset: -4px -7px; border: 1px solid rgba(253,243,184,.75); border-radius: 6px; opacity: 0; pointer-events: none; }
  body.go .stamp:not([hidden]) { animation: stampin .28s cubic-bezier(.2,.9,.25,1) .45s both; }
  body.go .stamp:not([hidden])::after { animation: ink .65s ease-out .62s both; }
  @keyframes stampin { 0% { opacity: 0; scale: 1.45; } 55% { opacity: 1; } 100% { scale: 1; } }
  @keyframes ink { 0% { opacity: .85; scale: .92; } 100% { opacity: 0; scale: 1.1; } }
  /* P8 - header band: rim-lit cloud edge, top highlight, one-shot sheen; lit icon medallion */
  :root { --edge: rgba(70,190,235,.55); --sheen: 190,238,255; }
  body.k-morning { --edge: rgba(255,196,130,.62); }
  body.k-midday  { --edge: rgba(60,214,206,.58); }
  body.k-evening { --edge: rgba(122,150,230,.42); }
  body.k-weekly  { --edge: rgba(248,216,120,.72); --sheen: 255,236,170; }
  .hd { background: radial-gradient(110% 150% at 0% 0%, rgba(130,215,255,.10), transparent 55%), linear-gradient(180deg, var(--band), var(--band2));
  box-shadow: inset 0 1px 0 rgba(150,225,255,.20); }
  body.k-weekly .hd { box-shadow: inset 0 1px 0 rgba(255,230,160,.28), 0 10px 0 -9px rgba(248,216,120,.5); }
  .hd::after {
  background:
    radial-gradient(circle 10px at 10px 0, var(--band2) 9px, transparent 10px) 0 0 / 20px 10px repeat-x,
    radial-gradient(circle 6.5px at 15.5px 0, var(--band2) 5.5px, transparent 6.5px) 0 0 / 31px 7px repeat-x,
    radial-gradient(circle 4px at 7px 0, var(--band2) 3px, transparent 4px) 0 0 / 43px 5px repeat-x;
  filter: drop-shadow(0 1px 0 var(--edge)) drop-shadow(0 4px 5px rgba(0,0,0,.4)); }
  .hd .sweep { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .hd .sweep::before { content: ""; position: absolute; top: -10%; bottom: -10%; left: 0; width: 90px; opacity: 0;
  background: linear-gradient(90deg, transparent, rgba(var(--sheen),.14) 42%, rgba(255,255,255,.22) 50%, rgba(var(--sheen),.14) 58%, transparent);
  transform: translateX(-140px) skewX(-18deg); }
  .hd .sweep::after { content: ""; position: absolute; inset: 0; }                 /* per-kind scene layer, filled in P9 */
  body.go .hd .sweep::before { animation: sweep 1.1s cubic-bezier(.3,.6,.2,1) .4s 1 both; }
  @keyframes sweep { 0% { transform: translateX(-140px) skewX(-18deg); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateX(560px) skewX(-18deg); opacity: 0; } }
  .slot { position: relative;
  box-shadow: inset 0 0 0 3px var(--slot-fill), inset 0 0 0 4px var(--slot-border), inset 0 0 0 5px var(--slot-rim), 0 0 14px rgba(24,120,225,calc(.42 * var(--glow-k))); }
  .slot::after { content: ""; position: absolute; inset: 5px; pointer-events: none;
  background: linear-gradient(135deg, rgba(255,255,255,.20), rgba(255,255,255,0) 42%), radial-gradient(circle at 50% 125%, rgba(120,220,255,.30), transparent 62%); }
  /* P9 - per-kind scene in the header band (static, behind the text) + weekly crest */
  body.k-morning .eyebrow { color: #F6DDB4; }
  body.k-morning .hd .sweep::after {
  background: linear-gradient(0deg, var(--band2) 0, transparent 22px),
              radial-gradient(ellipse 150px 62px at 50% 96%, rgba(255,176,96,.38), transparent 72%),
              repeating-conic-gradient(from -75deg at 50% 138%, rgba(255,208,150,.12) 0 3.5deg, transparent 3.5deg 10deg);
  -webkit-mask: radial-gradient(ellipse 78% 150% at 50% 138%, #000 25%, transparent 78%);
  mask: radial-gradient(ellipse 78% 150% at 50% 138%, #000 25%, transparent 78%); }
  body.k-midday .hd .sweep::after {
  background: repeating-radial-gradient(circle at 94% -45%, rgba(80,225,215,.14) 0 1px, transparent 1px 13px);
  -webkit-mask: radial-gradient(circle at 94% -45%, #000, transparent 72%); mask: radial-gradient(circle at 94% -45%, #000, transparent 72%); }
  body.k-evening .hd .sweep::after { background:
    radial-gradient(circle 1.1px at 86% 16%, rgba(225,238,255,.9) 90%, transparent),
    radial-gradient(circle 1px at 93% 34%, rgba(225,238,255,.75) 90%, transparent),
    radial-gradient(circle 1.3px at 79% 11%, rgba(225,238,255,.85) 90%, transparent),
    radial-gradient(circle 1px at 97% 12%, rgba(225,238,255,.8) 90%, transparent),
    radial-gradient(circle 1px at 90% 52%, rgba(225,238,255,.6) 90%, transparent),
    radial-gradient(circle 46px at 92% -6%, rgba(185,210,255,.20), transparent); }
  .hcrest { position: absolute; z-index: 3; left: 50%; bottom: -14px; width: 64px; height: 24px; margin-left: -32px; color: var(--gold-soft);
  filter: drop-shadow(0 0 6px rgba(248,216,120,.5)); pointer-events: none; }
  .hcrest svg { width: 100%; height: 100%; display: block; }
  /* P10 - interface furniture: lit section rules + bracketed counts, glass stat chips, crest dividers (--orn follows the kind) */
  :root { --orn: rgba(185,165,106,.7); }
  body.k-morning { --orn: rgba(226,180,116,.72); }
  body.k-midday  { --orn: rgba(120,208,196,.62); }
  body.k-evening { --orn: rgba(160,176,218,.6); }
  body.k-weekly  { --orn: rgba(248,216,120,.75); }
  .sh svg { filter: drop-shadow(0 0 5px rgba(255,253,227,.45)); }
  .sh .ln { background: linear-gradient(90deg, #8FE6FF, #8FE6FF) 0 0 / 20px 1px no-repeat,                      /* lit start of the rule */
                      linear-gradient(90deg, rgba(45,143,176,.95), rgba(45,143,176,.12)) 0 0 / 100% 1px no-repeat; }
  .sh .n { position: relative; padding: 0 10px; }
  .sh .n::before, .sh .n::after { content: ""; position: absolute; top: 1px; bottom: 1px; width: 4px; border: 1px solid rgba(110,218,255,.5); }
  .sh .n::before { left: 0; border-right: 0; }
  .sh .n::after  { right: 0; border-left: 0; }
  .chip { background: radial-gradient(120% 95% at 50% 0%, rgba(20,110,150,.34), transparent 70%), var(--cell); box-shadow: inset 0 1px 0 rgba(130,225,255,.26); }
  .chip.gloom { background: radial-gradient(120% 95% at 50% 0%, rgba(90,63,102,.38), transparent 70%), var(--cell); box-shadow: inset 0 1px 0 rgba(200,170,235,.3); }
  .divider { color: var(--orn); height: 14px; margin-top: 12px; }
  .divider i { position: relative; }
  .divider i:first-child { background: linear-gradient(90deg, transparent, var(--orn) 65%); }
  .divider i:last-child  { background: linear-gradient(270deg, transparent, var(--orn) 65%); }
  .divider i::after { content: ""; position: absolute; top: -1px; width: 3px; height: 3px; border-radius: 50%; background: var(--orn); }
  .divider i:first-child::after { right: 0; }
  .divider i:last-child::after  { left: 0; }
  .divider svg { width: 36px; height: 14px; filter: drop-shadow(0 0 3px var(--orn)); }
  /* P11 - void depth: a faint cold wash under the header and an edge vignette over the existing dot grid */
  .card {
  background:
    radial-gradient(135% 95% at 50% 38%, transparent 52%, rgba(0,4,8,.55) 100%),
    radial-gradient(90% 38% at 50% 0%, rgba(10,70,105,.30), transparent 72%),
    radial-gradient(circle 1px at 20px 20px, var(--constellation) 98%, transparent) 0 0 / 46px 46px,
    linear-gradient(115deg, transparent 49.7%, rgba(13,50,63,.45) 50%, transparent 50.3%) 0 0 / 138px 138px,
    linear-gradient(180deg, #010001 0%, #020A12 100%);
  }


  /* ===== TOTK Adventure Log match (from in-game reference: tab bar, plates, New-style tags, map preview, prompts) ===== */
  /* top tab bar: report kinds as Purah Pad tabs; the active one sits between L / R keys with a glowing underline */
  .tabs { position: relative; z-index: 3; display: flex; align-items: center; justify-content: center; gap: 14px; height: 30px; padding: 0 12px;
    background: linear-gradient(180deg, #071F33, var(--band)); border-bottom: 1px solid rgba(110,218,255,.18); cursor: grab;
    font: italic 500 11.5px var(--font); color: rgba(191,230,255,.55); white-space: nowrap; }
  .tabs .tab { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 100%; }
  .tabs .tab.on { color: #E8F6FF; font-weight: 600; text-shadow: 0 0 8px rgba(47,168,255,.6); }
  .tabs .tab.on::after { content: ""; position: absolute; left: -4px; right: -4px; bottom: 0; height: 3px; border-radius: 2px 2px 0 0;
    background: #3FC6FF; box-shadow: 0 0 10px rgba(63,198,255,.8); }
  .tabs .key { display: inline-grid; place-items: center; width: 15px; height: 13px; border-radius: 3px; background: #D9E7EE; color: #0B2230;
    font: 700 9px/1 "Helvetica Neue", sans-serif; font-style: normal; }
  .hd { padding-top: 12px; }

  /* quest plates: outlined steel frame, notch block at the right end, no row icon (TOTK list entries carry none) */
  .q { grid-template-columns: 1fr 24px; gap: 0 10px; margin: 0 16px 9px 28px; padding: 7px 7px 7px 12px; min-height: 40px; border-radius: 1px;
    border: 1px solid rgba(150,178,192,.55); }
  .q .tslot { display: none; }
  .q .t { font-size: 15.5px; color: #8FD3FF; text-shadow: 0 0 8px rgba(6,52,94,.95), 0 0 14px rgba(47,168,255,.25); }
  .q.has-tag { margin-top: 13px; }
  .qtag { position: absolute; left: -9px; top: -10px; z-index: 1; height: 15px; padding: 0 6px; display: inline-flex; align-items: center;
    border-radius: 2px; font: italic 600 10.5px/1 var(--font); white-space: nowrap; pointer-events: none;
    background: #3B3517; border: 1px solid #A08B45; color: #F6E7A6; box-shadow: 0 0 6px rgba(0,0,0,.6); }
  .qtag.fun { background: #2A2340; border-color: #7E6FB6; color: #D9D0FF; }
  .q.done:not(.sel) { border-color: rgba(150,178,192,.22); background: transparent; }
  .q.done .t { color: #7A8794; }
  .q.done .qtag { opacity: .5; }
  .mk { border-radius: 1px; background: #0B1A22; border-color: rgba(150,178,192,.45); }
  .sh { margin-left: 22px; }
  .sh .ln { opacity: .35; }

  /* detail panel: map preview, title, giver ——— location line, description, latest objective in orange */
  .dmap { position: relative; margin: 2px 0 12px; height: 168px; border-radius: 3px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(232,214,160,.35), 0 0 22px rgba(0,0,0,.6); }
  .dmap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .dmap::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 120% at 50% 45%, transparent 55%, rgba(0,0,0,.72) 100%); }
  .dhead { display: flex; align-items: center; gap: 8px; }
  .dhead .tslot { width: 24px; height: 24px; flex: none; } .dhead .tslot svg { width: 14px; height: 14px; }
  .dtitle { margin-top: 0; font-size: 20px; color: #8FD3FF; text-shadow: 0 0 10px rgba(6,52,94,.95), 0 0 16px rgba(47,168,255,.35); }
  .giver { display: flex; align-items: center; gap: 8px; margin: 9px 0 2px; font-size: 12px; color: #E9EEF0; }
  .giver .bang { flex: none; width: 13px; height: 13px; border-radius: 50%; display: grid; place-items: center; background: var(--giver);
    color: #fff; font: 800 9px/1 "Helvetica Neue", sans-serif; font-style: normal; box-shadow: 0 0 0 1px rgba(242,175,132,.5); }
  .giver .gl { flex: 1; height: 1px; background: rgba(233,238,240,.35); }
  .giver .loc { color: #C9D3D8; white-space: nowrap; }
  .dtx.latest { color: #FF7A45; text-shadow: 0 0 8px rgba(80,20,0,.6); }
  .dtx.latest code { color: #FFD2BE; background: rgba(255,122,69,.14); }

  /* prompts: label first, then the key glyph (Select Ⓐ  Return Ⓑ) */
  .ft { gap: 18px; }
  .kp { flex-direction: row; gap: 7px; color: #DCEBF2; font-weight: 600; opacity: .9; }
  .kp.pri { color: #FFFFFF; }
  .kp i { background: #E8F1F5; color: #0B2230; }
  .kp:hover i { background: #FFFFFF; }


  /* ===== quest art tiles + TOTK tracking slot ===== */
  .q { grid-template-columns: 32px 1fr 24px; padding-left: 7px; }
  .qart { width: 32px; height: 32px; display: block; border-radius: 3px; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(232,214,160,.35), 0 0 0 1px rgba(0,0,0,.6); }
  .qart svg { width: 100%; height: 100%; display: block; }
  .q.done .qart { filter: grayscale(.85) brightness(.6); }
  .q.moved .qart { filter: grayscale(.5) brightness(.75); }
  .q.sel .qart { box-shadow: inset 0 0 0 1px rgba(251,228,106,.7), 0 0 8px rgba(251,228,106,.35); }
  body.k-weekly .qart { width: 28px; height: 28px; }
  body.k-weekly .q { grid-template-columns: 28px 1fr 22px; }
  .mk.s-todo svg { color: var(--gold); opacity: 0; transform: scale(.6); }
  .q.sel .mk.s-todo svg, .mk.s-todo:hover svg { opacity: .35; transform: none; }
  .mk.s-track { background: rgba(251,228,106,.10); border-color: var(--gold); box-shadow: inset 0 0 0 2px var(--slot-fill), 0 0 10px rgba(251,228,106,.45); }
  .mk.s-track svg { color: var(--gold); opacity: 1; transform: none; filter: drop-shadow(0 0 4px rgba(251,228,106,.8)); }
  .q.tracked .t { color: #E8F6FF; }
  .mi.c-live .g { color: var(--gold); }
  .dstat.live { color: var(--gold); border-color: rgba(251,228,106,.55); }


  /* ===== fixes: tags sit above the gold cursor; panels are opaque (the window has no frosted backing) ===== */
  .qtag { z-index: 3; }
  /* a row whose entrance animation has finished drops it: a filled animation keeps the row in its own stacking
     context, which would trap the Main/Fun tag under the gold cursor */
  body.go .q.settled:not(.flash) { animation: none; }
  .lists { isolation: isolate; }


  /* ===== TOTK tracking, matched to the game: a narrow dark-teal notch flush at the plate's right end; the tracked
     quest shows a small glowing gold ring with a pulse; the section icon carries the same ring; slate "New"-style tags ===== */
  .q { grid-template-columns: 32px 1fr; padding-right: 28px; }
  body.k-weekly .q { grid-template-columns: 28px 1fr; }
  .mk, body.k-weekly .mk { position: absolute; right: 0; top: 0; bottom: 0; width: 20px; height: auto; border: 0; border-radius: 0;
    border-left: 1px solid rgba(150,178,192,.28); background: #0B2F3C; box-shadow: none; }
  .mk:hover, .q.sel .mk { border-color: rgba(251,228,106,.35); box-shadow: none; background: #0E3A48; }
  .mk svg { width: 12px; height: 12px; }
  .mk.s-todo svg { color: var(--gold); opacity: 0; transform: scale(.7); }
  .q.sel .mk.s-todo svg, .mk.s-todo:hover svg { opacity: .4; transform: none; }
  .mk.s-track, .mk.s-done, .mk.s-moved { background: #0E3A48; border-color: rgba(150,178,192,.28); box-shadow: none; }
  .mk.s-track svg { color: #FFD54A; opacity: 1; transform: none; filter: drop-shadow(0 0 3px rgba(255,213,74,.9)); }
  .mk.s-track::after { content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
    border: 1.5px solid #FFD54A; pointer-events: none; animation: trkping 1.6s ease-out infinite; }
  @keyframes trkping { 0% { transform: scale(.85); opacity: .9; } 100% { transform: scale(2.3); opacity: 0; } }
  .mk.s-done svg { width: 11px; height: 11px; color: var(--mint); }
  .mk.s-moved svg { width: 11px; height: 11px; color: var(--gloom); }
  .q.flash .mk::after { inset: 4px 2px; }
  .sh { position: relative; }
  .sh.has-track::before { content: ""; position: absolute; left: 9px; top: -3px; width: 6px; height: 6px; border-radius: 50%;
    border: 1.5px solid #FFD54A; background: radial-gradient(circle, #FFD54A 0 1.2px, transparent 1.6px); box-shadow: 0 0 5px rgba(255,213,74,.8); }
  .qtag { background: #1E3446; border-color: #5B7A90; color: #F2C14E; }
  .qtag.fun { background: #1E3446; border-color: #5B7A90; color: #CFC4FF; }
  /* detail header: the game's objective line ("No objective set" until a quest is tracked) */
  .dobj { background: none; border: 0; padding: 0; display: inline-flex; align-items: center; gap: 8px; font: italic 600 12.5px var(--font); color: var(--cream-grey); cursor: pointer; }
  .dobj .ring { position: relative; width: 18px; height: 18px; display: grid; place-items: center; color: #6F7F88; }
  .dobj .ring svg { width: 16px; height: 16px; }
  .dobj.on { color: #FFE9A6; } .dobj.on .ring { color: #FFD54A; filter: drop-shadow(0 0 4px rgba(255,213,74,.8)); }
  .dobj.on .ring::after { content: ""; position: absolute; inset: 1px; border-radius: 50%; border: 1.5px solid #FFD54A; animation: trkping 1.6s ease-out infinite; }


  /* ===== review fixes ===== */
  .sh .heart svg { color: var(--heart); }
  body.k-weekly .lists { max-height: 600px; }
  /* a done row's tag is dimmed with opaque colours (half of the normal ones over the void), not opacity,
     so the plate's border never shows through the label */
  .q.done .qtag { opacity: 1; background: #101C27; border-color: #2E3F4C; color: #7A632B; }
  .q.done .qtag.fun { color: #686484; }

  /* ===== full-screen Purah Pad (default): list left, detail right, tabs on top, prompts bottom-right ===== */
  body.full { background: radial-gradient(ellipse at 50% 40%, rgba(4,16,28,.82), rgba(0,0,0,.93)); }
  body.full .stage { position: fixed; inset: 3.5vh 3.2vw; width: auto; margin: 0 !important; display: grid; align-items: stretch;
    grid-template-columns: minmax(440px, 43%) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; column-gap: 26px; padding: 0 26px;
    border-radius: 26px; border: 2px solid rgba(42,180,224,.75);
    background:
      radial-gradient(circle 1px at 20px 20px, var(--constellation) 98%, transparent) 0 0 / 46px 46px,
      linear-gradient(115deg, transparent 49.7%, rgba(13,50,63,.45) 50%, transparent 50.3%) 0 0 / 138px 138px,
      linear-gradient(180deg, #010001, #020A12);
    box-shadow: 0 0 0 1px rgba(2,189,247,.15), 0 0 46px rgba(42,180,224,.28), inset 0 0 70px rgba(42,180,224,.10);
    animation: fullin .32s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fullin { from { opacity: 0; transform: scale(.97); } }
  body.full .stage::before, body.full .stage::after { content: ""; position: absolute; top: 9%; bottom: 9%; width: 56px; border-radius: 28px;
    pointer-events: none; opacity: .6; background: repeating-radial-gradient(circle at 50% 50%, rgba(130,136,138,.55) 0 3px, rgba(40,44,46,.65) 3px 7px) 0 0 / 56px 56px; }
  body.full .stage::before { left: -42px; } body.full .stage::after { right: -42px; }
  body.full .stage > .tabs { grid-column: 1 / -1; grid-row: 1; height: 48px; margin: 0 -26px; gap: 34px; font-size: 14.5px; border-radius: 24px 24px 0 0;
    background: linear-gradient(180deg, rgba(6,49,77,.9), rgba(4,36,58,.35)); cursor: default; }
  body.full .tabs .key { width: 18px; height: 16px; font-size: 10px; }
  body.full .card { grid-column: 1; grid-row: 2; width: auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
    border: 0; border-radius: 0; background: transparent; box-shadow: none; animation: none !important; }
  body.full .card::after, body.full .stone2 { display: none; }
  body.full .hd { margin-top: 14px; border-radius: 12px; cursor: default; }
  body.full #body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  body.full .lists { flex: 1; min-height: 0; max-height: none !important; }
  body.full .desc, body.full .note { display: none; }
  body.full .sidepane { grid-column: 2; grid-row: 2; width: auto; height: auto !important; margin-top: 14px; border: 0; border-radius: 0;
    background: transparent; box-shadow: none; animation: none !important; }
  body.full .sidepane .detail { padding: 0 8px 18px 22px; background: transparent; border-left: 1px solid rgba(110,218,255,.14); }
  body.full .dtop { margin: 0 -8px 0 -22px; padding: 0 8px 0 22px; background: linear-gradient(180deg, #03111C, rgba(3,17,28,.92)); border-radius: 0; }
  body.full .dmap { height: clamp(200px, 33vh, 400px); }
  body.full .dtitle { font-size: 28px; } body.full .dtx { font-size: 15.5px; } body.full .steps li { font-size: 14.5px; }
  body.full .q .t { font-size: 17px; }
  body.full .stage > .ft { grid-column: 1 / -1; grid-row: 3; margin: 0 -26px; padding: 14px 34px 18px; gap: 26px; border-radius: 0 0 24px 24px;
    background: linear-gradient(0deg, rgba(6,49,77,.75), transparent); }
  body.full .stage > .ft::before { display: none; }
  body.full .kp { font-size: 14px; }
  .ft { gap: 14px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    body:not(.go) .card, body:not(.go) .anim, body:not(.go) .q { opacity: 1; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
<div class="card" id="card">
  <div class="stone2"></div>
  <div class="hd" id="hd">
    <i class="sweep"></i>
    <div class="slot" id="kicon"></div>

      <div class="eyebrow" id="eyebrow"></div>

    </div>
    <div class="stamp" id="stamp" hidden>Complete</div>
  </div>
  <div id="body"></div>
  <div class="ft">
    <button class="kp" id="kTrack" title="T"><span>Track</span><i>T</i></button>

    <button class="kp pri" id="kOpen" title="Enter"><span>Details</span><i><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2.5v3.2a1.3 1.3 0 0 1-1.3 1.3H2.8M5 4.8 2.7 7 5 9.2"/></svg></i></button>
    <button class="kp" id="kBoard" title="B"><span>Board</span><i>B</i></button>
    <button class="kp" id="kMode" title="M"><span>Expand</span><i>M</i></button>
    <button class="kp" id="kClose" title="Esc"><span>Close</span><i class="pill">esc</i></button>
  </div>
  <div class="toast" id="toast"></div>
</div>
<div class="sidepane" id="side" hidden></div>
</div>

<script>
(() => {
  /* ---------- original glyphs (inline SVG, no game assets) ---------- */
  const G = {
    main: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M1 11 L8 3 L15 11 L12 11 L8 6.8 L4 11Z"/><circle cx="8" cy="12.8" r="1.4"/></svg>',
    side: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="2" width="10" height="12" rx="2"/><path d="M6 6h4M6 9h4"/></svg>',
    fun:  '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 3h12v8H8l-3 3v-3H2z"/></svg>',

  /* ---------- quest rows ---------- */
  const STATUS = { todo: "📜 To Do", grinding: "🔥 Grinding", delay: "⏸ Delay", done: "✅ Cleared" };

  const rows = [];   // {it, el, mk, id, sec, orig: {status, date}, now: {status, date}, done, sync}

  sections.forEach((sec, si) => {
    const items = (sec.items || []).filter(it => !isFiller(it));

      const firstType = (items[0] && items[0].type) || "main";

      lists.appendChild(sh);

    if (!items.length) {
      if (sec.empty) { const e = el("div", "empty anim", sec.empty); e.style.setProperty("--i", order++); lists.appendChild(e); }
      return;
    }
    const sorted = [...items.filter(i => !i.done), ...items.filter(i => i.done)];
    sorted.slice(0, CAP).forEach(it => {
      const type = ["main", "side", "fun"].includes(it.type) ? it.type : "side";

      const q = el("div", "q " + type + (id ? " pick" : ""));
      q.setAttribute("role", "option");
      q.style.setProperty("--i", Math.min(order++, 9));
      const ts = svgEl(G[type], "tslot " + type);
      ts.title = TYPE_LABEL[type];
      q.appendChild(ts);
      const tile = ART.tile(it), art = el("span", "qart"); art.style.background = tile.bg; art.innerHTML = tile.svg;

      const mid = el("div");
      mid.appendChild(put(el("div", "t"), it.title || ""));

      const mk = el(id ? "button" : "span", "mk" + (id ? "" : " static"));
      if (id) { mk.type = "button"; noFocus(mk); mk.setAttribute("aria-label", "Track quest"); mk.title = "Track (T) · Status menu: Space"; }
      q.appendChild(mk);
      if (type !== "side") { q.appendChild(el("span", "qtag " + type, type === "main" ? "Main" : "Fun")); q.classList.add("has-tag"); }

      const date = parseIso(it.date) ? it.date : null;

    if (sorted.length > CAP || fillers.length) {
      const m = el("div", "more anim", sorted.length > CAP ? "+" + (sorted.length - CAP) + " more" : fillers[0].title);

  if (D.xp && D.xp.length) {
    const sh = el("div", "sh anim"); sh.style.setProperty("--i", order++);

      const it = el("div", "it");
