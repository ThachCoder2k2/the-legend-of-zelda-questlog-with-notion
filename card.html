  const renderDetail = (r) => {
    const it = r.it, type = ["main", "side", "fun"].includes(it.type) ? it.type : "side";
    detail.textContent = "";
    detail.appendChild(svgEl(G.weekly, "emblem"));
    const top = el("div", "dtop");
    const tracked = !r.done && r.now.status === STATUS.grinding;
    const obj = noFocus(el("button", "dobj" + (tracked ? " on" : "")));
    obj.type = "button"; obj.title = tracked ? "Stop tracking (T)" : "Track this quest (T)";
    obj.appendChild(svgEl(G.track, "ring"));
    obj.appendChild(el("span", null, tracked ? "Tracking this quest" : r.done ? "Quest cleared" : "No objective set"));
    obj.addEventListener("click", e => { e.stopPropagation(); toggleTrack(r); });
    top.appendChild(obj); top.appendChild(el("i", "sp"));
    const [sl, sc] = statusLabel(r);
    dstatBtn = noFocus(el("button", "dstat " + sc));
    dstatBtn.type = "button"; dstatBtn.title = "Change status (Space)";
    dstatBtn.innerHTML = statusGlyph(r); dstatBtn.appendChild(el("span", null, sl));
    dstatBtn.addEventListener("click", e => { e.stopPropagation(); menuRow === r ? closeMenu() : openMenu(r, dstatBtn); });
    top.appendChild(dstatBtn);
    detail.appendChild(top);
    const map = el("div", "dmap"); map.innerHTML = ART.banner(it); detail.appendChild(map);
    const head = el("div", "dhead"); head.appendChild(svgEl(G[type], "tslot " + type)); head.appendChild(put(el("div", "dtitle"), it.title || ""));
    detail.appendChild(head);
    const giver = el("div", "giver");   // the game's "quest giver ——— location" line: questline ——— day
    giver.appendChild(el("span", "bang", "!"));
    giver.appendChild(put(el("span"), it.questline || TYPE_LABEL[type]));
    giver.appendChild(el("i", "gl"));
    const when = dayLabel(r.now.date) || it.label || "";
    giver.appendChild(el("span", "loc", (isMoved(r) ? "Moved to " : "") + when));
    detail.appendChild(giver);
    const meta = el("div", "dmeta");
    const e = energySpan(it); if (e) meta.appendChild(e);
    if (meta.childNodes.length) detail.appendChild(meta);
    if (it.goal) { const s = section(G.goal, "Questline goal"); const t = el("div", "dtx"); put(t, it.goal); s.appendChild(t); detail.appendChild(s); }
    const s2 = section(G.spark, "Next step: 2-minute start"), t2 = el("div", "dtx latest");
    const start = it.start || (!hasStart && callout ? callout.text : "");
    if (start) richText(t2, start); else { t2.classList.add("muted"); t2.textContent = "No 2-minute start yet. Add one in Notion."; }
    s2.appendChild(t2); detail.appendChild(s2);
    let steps = Array.isArray(it.steps) ? it.steps.filter(x => x && x.title) : [];
    const isMine = (st) => pageId(st) ? pageId(st) === r.id : st.title === it.title;
    const rowOf = (st) => {   // by page id; a step without a url matches a row with the same title, if only one quest has it
      const pid = pageId(st); if (pid) return rows.find(x => x.id === pid) || null;
      const same = rows.filter(x => x.id && x.it.title === st.title);
      return same.length && same.every(x => x.id === same[0].id) ? same[0] : null;
    };
    const stepDone = (st) => { const row = rowOf(st); return row ? row.done : !!st.done; };
    if (steps.length > 8) {   // keep this quest, then unfinished steps, then the most recent cleared ones
      const keep = new Set([...steps.filter(isMine), ...steps.filter(st => !isMine(st) && !stepDone(st)), ...steps.filter(stepDone).reverse()].slice(0, 8));
      steps = steps.filter(st => keep.has(st));
    }
    if (steps.length) {
      const s3 = section(G.log, "Questline log"), ul = el("ul", "steps");
      steps.forEach(st => {
        const mine = isMine(st), row = mine ? r : rowOf(st);
        const doneStep = row ? row.done : !!st.done;
        const li = el("li", doneStep ? "done" : mine ? "this" : "");
        const dot = el("span", "dot"); if (doneStep) dot.innerHTML = G.check;
        li.appendChild(dot); li.appendChild(put(el("span"), st.title));
        const sd = dayLabel(row ? row.now.date : st.date); if (sd) li.appendChild(el("span", "sd", sd));
        ul.appendChild(li);
      });
      s3.appendChild(ul); detail.appendChild(s3);
    }
    dsyncEl = el("div", "dsync"); detail.appendChild(dsyncEl);
    const [text, cls] = syncText(r); dsyncEl.textContent = text; if (cls) dsyncEl.classList.add(cls);
  };
  const positionDetail = () => { side.style.height = full ? "" : cardEl.offsetHeight + "px"; };
  const openDetail = (r) => {
    if (!r || !r.id || leaving) return;
    if (performance.now() - goAt < 800) return;
    select(r, { sound: false });
    const wasOpen = !!detailRow;
    detailRow = r;
    if (full) { renderDetail(r); detail.scrollTop = 0; updateButtons(); return; }   // full screen: the panel is always there
    positionDetail(); renderDetail(r);
    detail.scrollTop = 0;
    if (!wasOpen) {
      post({ action: "expand", width: STAGE_W });   // the host widens the window for the side panel
      side.hidden = false;
      side.classList.remove("in"); void side.offsetWidth; side.classList.add("in");
    }
    document.body.classList.add("detail-open");
    sfx("select", 0);
    updateButtons();
  };
  const closeDetail = (sound = true) => {
    if (!detailRow || full) return;
    closeMenu(false);
    side.hidden = true; detailRow = null; dsyncEl = null; dstatBtn = null;
    document.body.classList.remove("detail-open");
    post({ action: "expand", width: CARD_W });
    if (sound) sfx("cancel", 0);
    updateButtons(); placeCursor();
  };
  const pageDetail = (dir) => move(dir);   // the detail follows the cursor (see select)

  /* ---------- actions ---------- */
  let leaving = false;
  const leave = (action, extra) => {
    if (leaving) return; leaving = true;
    sfx(action === "open" ? "select" : "close", 0);
    document.body.classList.add("leaving");
    setTimeout(() => post(Object.assign({ action }, extra || {})), 150);
  };
  const openRow = (r) => (r && r.id) ? leave("open", { url: "notion://www.notion.so/" + r.id }) : leave("open");
  const kAct = document.getElementById("kAct"), kOpen = document.getElementById("kOpen");
  const kBoard = document.getElementById("kBoard"), kClose = document.getElementById("kClose");
  const kTrack = document.getElementById("kTrack"), kMode = document.getElementById("kMode");
  const setLabel = (b, t) => { b.querySelector("span").textContent = t; };
  function updateButtons() {
    const m = !!menuRow, d = !!detailRow, cur = (d ? detailRow : sel) || {};
    kAct.hidden = m || !pickable.length;
    kAct.disabled = !cur.id;
    kTrack.hidden = m || !pickable.length || !full;   // the corner card's footer is narrow; T still works there
    kTrack.disabled = !cur.id;
    setLabel(kTrack, cur.id && !cur.done && cur.now.status === STATUS.grinding ? "Untrack" : "Track");
    kBoard.hidden = m || !full;                         // B still works on the corner card
    kMode.hidden = m || (d && !full);
    setLabel(kMode, full ? "Minimize" : "Expand");
    setLabel(kOpen, m ? "Choose" : d ? "Open in Notion" : sel && sel.id ? "Details" : "Open board");
    setLabel(kClose, m || (d && !full) ? "Back" : "Close");
  }
  document.querySelectorAll(".kp").forEach(noFocus);
  kAct.onclick = () => detailRow ? openMenu(detailRow, dstatBtn) : openMenu(sel);
  kOpen.onclick = () => menuRow ? choose(menuSel) : detailRow ? openRow(detailRow) : (sel && sel.id) ? openDetail(sel) : leave("open");
  kBoard.onclick = () => leave("open");
  kClose.onclick = () => menuRow ? closeMenu() : (detailRow && !full) ? closeDetail() : leave("close");
  kTrack.onclick = () => toggleTrack(detailRow || sel);
  kMode.onclick = () => setFull(!full);

  // Full screen <-> corner card. The host resizes the window; the page moves the tabs and prompts.
  const setFull = (on, notify = true) => {
    if (notify && on === full) return;
    full = on;
    closeMenu(false);
    document.body.classList.toggle("full", on);
    if (on) {
      stage.insertBefore(tabs, stage.firstChild); stage.appendChild(ftEl);
      stage.classList.remove("flip"); side.hidden = false; side.style.height = "";
      const r = (sel && sel.id) ? sel : pickable[0];
      detailRow = r || null; if (r) renderDetail(r);
      document.body.classList.add("detail-open");
    } else {
      cardEl.insertBefore(tabs, hd); cardEl.insertBefore(ftEl, toastEl);
      side.hidden = true; detailRow = null; dsyncEl = null; dstatBtn = null;
      document.body.classList.remove("detail-open"); stage.classList.toggle("flip", sideLeft);
      lastH = 0; lastDrag = 0;
    }
    if (notify) { post({ action: "layout", mode: on ? "full" : "compact" }); sfx(on ? "select" : "cancel", 0); }
    updateButtons();
    requestAnimationFrame(() => { fitToScreen(); lockPaneHeight(); report("resize"); placeCursor(); edge(); });
  };

  rows.forEach(r => {
    if (!r.id) return;
    // Hover selects only when the pointer really moves, so a pointer resting under the card as it opens (the
    // menu-bar button leaves it near the top) never steals the cursor from the first quest.
    r.el.addEventListener("mousemove", (e) => {
      if (menuRow || r === sel || performance.now() - goAt < 600 || !(e.movementX || e.movementY)) return;
      select(r);
    });
    r.el.addEventListener("click", (e) => { if (e.target.closest(".mk") || menuRow) return; select(r); });
    r.el.addEventListener("dblclick", (e) => { if (e.target.closest(".mk")) return; openDetail(r); });
    r.mk.addEventListener("click", (e) => { e.stopPropagation(); if (menuRow) closeMenu(false); select(r, { sound: false }); toggleTrack(r); });
  });
  // a click outside the open menu closes it
  document.addEventListener("pointerdown", (e) => {
    if (menuRow && !menu.contains(e.target) && !e.target.closest(".mk, .dstat, .kp")) closeMenu();
  });

  // Keys count only after the user has clicked the card, so stray typing meant for another app never changes a quest.
  let touched = false;
  document.addEventListener("pointerdown", () => { if (performance.now() - goAt >= 800) touched = true; }, true);
  document.addEventListener("pointerdown", (e) => {   // a click on the dimmed backdrop shrinks to the corner card
    if (full && !e.target.closest(".stage") && performance.now() - goAt >= 800) setFull(false);
  });
  const KEYPROMPT = { Enter: "kOpen", " ": "kAct", b: "kBoard", B: "kBoard", Escape: "kClose", t: "kTrack", T: "kTrack", m: "kMode", M: "kMode" };
  const flash = (id) => { const b = document.getElementById(id); if (!b || b.hidden) return; b.classList.add("hit"); setTimeout(() => b.classList.remove("hit"), 140); };
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (e.repeat && !["ArrowDown", "ArrowUp", "j", "k", "Tab"].includes(k)) { e.preventDefault(); return; }   // only navigation repeats
    if (KEYPROMPT[k] && (touched || k === "Escape")) flash(KEYPROMPT[k]);
    if (menuRow) {
      e.preventDefault();
      if (k === "Escape" || k === "Backspace" || k === "ArrowLeft") closeMenu();
      else if (k === "ArrowDown" || k === "j" || k === "Tab") menuMove(1);
      else if (k === "ArrowUp" || k === "k") menuMove(-1);
      else if (k === "Enter" || k === " ") choose(menuSel);
      return;
    }
    if (k === "Escape") { (detailRow && !full) ? closeDetail() : leave("close"); return; }
    if (!touched) return;
    if (k === "m" || k === "M") { e.preventDefault(); setFull(!full); return; }
    if (k === "b" || k === "B") { leave("open"); return; }
    if (detailRow) {
      if (k === "t" || k === "T") { e.preventDefault(); toggleTrack(detailRow); }
      else if (k === "Enter") { e.preventDefault(); openRow(detailRow); }
      else if (k === " ") { e.preventDefault(); openMenu(detailRow, dstatBtn); }
      else if (k === "ArrowDown" || k === "j") { e.preventDefault(); pageDetail(1); }
      else if (k === "ArrowUp" || k === "k") { e.preventDefault(); pageDetail(-1); }
      else if ((k === "Backspace" || k === "ArrowLeft") && !full) { e.preventDefault(); closeDetail(); }
      return;
    }
    if (k === "t" || k === "T") { e.preventDefault(); toggleTrack(sel); return; }
    if (k === "Enter" || k === "ArrowRight") { e.preventDefault(); (sel && sel.id) ? openDetail(sel) : leave("open"); }
    else if (k === " " || k === "Spacebar") { e.preventDefault(); openMenu(sel); }
    else if (k === "ArrowDown" || k === "j") { e.preventDefault(); move(1); }
    else if (k === "ArrowUp" || k === "k") { e.preventDefault(); move(-1); }
    else if (k === "b" || k === "B") leave("open");
  });

  // a soft tick for every row's worth of list scrolling; scrolling also closes the menu (it would drift)
  let tickTop = 0;
  lists.addEventListener("scroll", () => {
    edge();
    if (menuRow && !detailRow) closeMenu(false);
    if (Math.abs(lists.scrollTop - tickTop) >= 28) { tickTop = lists.scrollTop; sfx("scroll", 40); }
  }, { passive: true });
  detail.addEventListener("scroll", () => { if (menuRow) closeMenu(false); }, { passive: true });

  // first selection: the first unfinished Main quest, like the game's cursor on the next objective
  const first = pickable.find(r => !r.done && r.it.type === "main") || pickable.find(r => !r.done) || pickable[0];
  if (first) select(first); else { fillPane(null); updateButtons(); }
  if (full) setFull(true, false);

  /* start motion when the window is on screen */
  let started = false;
  const go = () => {
    if (started) return; started = true;
    goAt = performance.now();
    document.body.classList.add("go");
    const fillAll = () => {
      if (P && P.total) { setRing(wheel.outer, P.done / P.total); }
      if (wheel.inner) {
        const mains = rows.filter(r => r.it.type === "main");
        setRing(wheel.inner, mains.length ? mains.filter(r => r.done).length / mains.length : 0);
      }
      document.querySelectorAll(".xp .tr i").forEach(i => { i.style.width = i.dataset.w + "%"; });
      placeCursor();
    };
    requestAnimationFrame(fillAll);
    setTimeout(fillAll, 400);   // fallback if rAF is throttled
    setTimeout(() => { cursorReady = true; placeCursor(); arrive(); }, 900);
  };
  window.QL_GO = go;
  setTimeout(go, inApp ? 1500 : 50);

  /* keep the window height in sync with the content, and tell the host where the drag handle is */
  let lastH = 0, lastDrag = 0;
  let fitting = false, readySent = false;
  const report = (action) => {
    if (full) {   // the window is the whole screen: nothing to size, nothing to drag (but the host still waits for "ready")
      if (action === "ready" && !readySent) { readySent = true; post({ action: "ready", height: Math.ceil(cardEl.getBoundingClientRect().height) || 600 }); }
      if (lastDrag !== "full") { lastDrag = "full"; post({ action: "dragzone", height: 0 }); }
      placeCursor(); edge(); return;
    }
    if (!fitting && +ENV.maxHeight && Math.ceil(cardEl.getBoundingClientRect().height) > +ENV.maxHeight) {
      fitting = true; fitToScreen(); fitting = false;   // the wheel or the stamp appeared: keep the footer on screen
    }
    const h = Math.ceil(cardEl.getBoundingClientRect().height);
    if (h && h !== lastH) { lastH = h; post({ action, height: h }); }
    const dz = Math.ceil(hd.getBoundingClientRect().bottom - cardEl.getBoundingClientRect().top);
    const cb = cardEl.getBoundingClientRect(), dzKey = dz + ":" + Math.round(cb.left);
    if (dz && dzKey !== lastDrag) { lastDrag = dzKey; post({ action: "dragzone", height: dz, x0: Math.round(cb.left), x1: Math.round(cb.right) }); }
    if (detailRow) positionDetail();
    placeCursor(); edge();
  };
  // Keep the pane from changing height as the cursor moves: size it for the tallest quest once.
  const lockPaneHeight = () => {
    if (!desc.isConnected || !pickable.length) return;
    let max = 0;
    const keep = sel;
    pickable.forEach(r => { fillPane(r); max = Math.max(max, dBody.offsetHeight); });
    dBody.style.minHeight = max + "px";
    if (keep) fillPane(keep);
  };
  // A tall card on a small screen: shrink the quest list so the footer stays visible.
  const fitToScreen = () => {
    const maxH = +ENV.maxHeight;
    if (full) { lists.style.maxHeight = ""; return; }
    if (!maxH || !lists.isConnected) return;
    lists.style.maxHeight = "";
    const over = Math.ceil(cardEl.getBoundingClientRect().height) - maxH;
    if (over > 0) lists.style.maxHeight = Math.max(140, lists.clientHeight - over) + "px";
  };
  lockPaneHeight();
  fitToScreen();
  setTimeout(() => report("ready"), 0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { lockPaneHeight(); fitToScreen(); report("resize"); });
  if (window.ResizeObserver) new ResizeObserver(() => report("resize")).observe(cardEl);
  window.addEventListener("resize", () => report("resize"));   // the window grew or shrank for the side panel
})();
</script>
</body>
</html>
